metadata:
  name: pytorch-ultralytics-yoloe
  namespace: cvat
  annotations:
    name: YOLOE Auto Label
    type: detector
    dynamic_labels: "true"
    supported_shape_types: rectangle
    spec: |
      []
spec:
  description: YOLOE open-vocabulary detector with task label text prompts
  runtime: python:3.10
  handler: main:handler
  eventTimeout: 60s
  resources:
    limits:
      nvidia.com/gpu: 1
  build:
    image: cvat.pytorch.ultralytics.yoloe
    baseImage: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y git python3 python3-pip python-is-python3 libglib2.0-0 libgl1 libxcb1 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu124
        - kind: RUN
          value: pip install --no-cache-dir ultralytics==8.4.0 pillow
        - kind: RUN
          value: pip install --no-cache-dir git+https://github.com/openai/CLIP.git
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: python -c "from ultralytics import YOLOE; model = YOLOE('yoloe-26l-seg.pt'); model.set_classes(['car', 'truck', 'bus', 'van'])"
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
