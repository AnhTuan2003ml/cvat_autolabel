metadata:
  name: pytorch-ultralytics-yolo26s
  namespace: cvat
  annotations:
    name: YOLO26s Auto Label
    type: detector
    supported_shape_types: rectangle
    spec: |
      [{"name":"car","type":"rectangle","attributes":[]},{"name":"truck","type":"rectangle","attributes":[]},{"name":"bus","type":"rectangle","attributes":[]},{"name":"van","type":"rectangle","attributes":[]}]
spec:
  description: Fine-tuned YOLO26s detector for car, truck, bus and van
  runtime: python:3.10
  handler: main:handler
  eventTimeout: 60s
  resources:
    limits:
      nvidia.com/gpu: 1
  build:
    image: cvat.pytorch.ultralytics.yolo26s
    baseImage: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y python3 python3-pip python-is-python3 libglib2.0-0 libgl1 libxcb1 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cu124
        - kind: RUN
          value: pip install --no-cache-dir ultralytics==8.4.0 pillow
        - kind: WORKDIR
          value: /opt/nuclio
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
